services:
  octopus:
    image: lingyuins/octopus:v1.8.7
    container_name: octopus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      TZ: "Asia/Shanghai"
      OCTOPUS_AUTH_JWT_SECRET: "change-this-to-a-long-random-secret"
