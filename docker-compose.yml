services:
  octopus:
    image: lingyuins/octopus:v2.6.3-fix2
    container_name: octopus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - octopus-data:/app/data
    environment:
      # 容器时区；海外部署可改为显式 IANA 时区名，例如 America/Los_Angeles
      TZ: "Asia/Shanghai"
      # OCTOPUS_AUTH_JWT_SECRET: ""  # 请设置一个随机长字符串以保持 JWT 跨重启有效；留空则每次启动自动生成临时密钥
      # 反向代理 / Docker bridge 部署：默认不信任代理，client_ip 会是网关地址（如 172.17.0.1）。
      # 配置代理网段以解析真实客户端 IP，例如默认 Docker bridge 用 172.17.0.0/16
      # OCTOPUS_SERVER_TRUSTED_PROXIES: "172.17.0.0/16"
volumes:
  octopus-data:

