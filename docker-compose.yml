services:
  octopus:
    image: lingyuins/octopus:v2.7.3-Fix2
    container_name: octopus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - octopus-data:/app/data
    environment:
      # 容器时区；海外部署可改为显式 IANA 时区名，例如 America/Los_Angeles
      TZ: "Asia/Shanghai"
      # 必须提供持久密钥，否则服务会拒绝启动以避免加密凭据不可恢复。
      OCTOPUS_AUTH_JWT_SECRET: "${OCTOPUS_AUTH_JWT_SECRET:?Set OCTOPUS_AUTH_JWT_SECRET before starting Octopus}"
      # 反向代理 / Docker bridge 部署：默认不信任代理，client_ip 会是网关地址（如 172.17.0.1）。
      # 配置代理网段以解析真实客户端 IP，例如默认 Docker bridge 用 172.17.0.0/16
      # OCTOPUS_SERVER_TRUSTED_PROXIES: "172.17.0.0/16"
volumes:
  octopus-data:

